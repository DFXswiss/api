name: API PR CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build and test
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres so the Aktionariat-registration backfill migration suite runs on every PR.
      # The suite is skipped when MIGRATION_TEST_PG is unset; all other tests use mocks and ignore it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install packages
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: npm ci

      - name: Run linter
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build code
        run: npm run build

      - name: Run tests
        run: npm run test
        env:
          MIGRATION_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres

      - name: Enforce Bank Frick coverage
        run: npm run test:frick:cov

      - name: Security audit
        run: npm audit --audit-level=critical
