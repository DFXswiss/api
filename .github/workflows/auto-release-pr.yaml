name: Auto Release PR

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # `write` is required because the release PR is opened with the workflow's own
  # GITHUB_TOKEN (see the create step) rather than with a personal access token.
  pull-requests: write

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Check for existing PR
        id: check-pr
        run: |
          PR_COUNT=$(gh pr list --base main --head develop --state open --json number --jq 'length')
          echo "pr_exists=$([[ $PR_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "::notice::Open PRs from develop to main: $PR_COUNT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for differences
        id: check-diff
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          DIFF_COUNT=$(git rev-list --count origin/main..origin/develop)
          echo "has_changes=$([[ $DIFF_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "commit_count=$DIFF_COUNT" >> $GITHUB_OUTPUT
          echo "::notice::Commits ahead of main: $DIFF_COUNT"

      - name: Create Release PR
        if: steps.check-pr.outputs.pr_exists == 'false' && steps.check-diff.outputs.has_changes == 'true'
        env:
          # The release PR must be authored by the Actions bot, not by a person. A personal
          # access token would put a human's name on an automated PR and tie the automation to
          # one account's credential lifetime.
          #
          # Cost, deliberately accepted: under this repository's Actions approval policy
          # (`all_external_contributors`), the runs for the `opened` activity — the ones
          # `github-actions[bot]` triggers by creating the PR — are held. Attempt 1 completes as
          # `action_required` with zero jobs; a manual approval starts attempt 2, which is what
          # actually executes. Only those are held: later `synchronize` runs from human pushes to
          # `develop` execute on attempt 1, and so did the PAT-authored release PRs.
          #
          # Consequence for reviewers: a freshly opened release PR shows a mix. Its pending
          # `pull_request` entries carry no jobs, while other green checks can be `develop` push
          # runs for the same head commit — real results, but not PR CI against `main`. Approve
          # the held runs, then check that what you read belongs to the `pull_request` runs for
          # the current head.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_COUNT: ${{ steps.check-diff.outputs.commit_count }}
        run: |
          printf '%s\n' \
            "## Automatic Release PR" \
            "" \
            "This PR was automatically created after changes were pushed to develop." \
            "" \
            "**Commits:** ${COMMIT_COUNT} new commit(s)" \
            "" \
            "### Checklist" \
            "- [ ] Review all changes" \
            "- [ ] Verify CI passes" \
            "- [ ] Approve and merge when ready for production" \
            > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head develop \
            --title "Release: develop -> main" \
            --body-file /tmp/pr-body.md
